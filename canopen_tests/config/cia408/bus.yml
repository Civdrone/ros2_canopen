options:
  dcf_path: "@BUS_CONFIG_PATH@"

master:
  node_id: 1
  driver: "ros2_canopen::MasterDriver"
  package: "canopen_master_driver"
  sync_period: 10000

defaults:
  # EDS authored from Danfoss manual BC180386484705en-000802 (PVED-CC Series 5)
  # and verified against the live unit. See PVE_CC.eds header.
  dcf: "PVE_CC.eds"
  driver: "ros2_canopen::Cia408Driver"
  package: "canopen_408_driver"
  period: 10
  boot_timeout_ms: 10000               # PVED runs a power-on self-test after NMT
                                       # reset; 1s is not enough to finish boot config

  # One-shot SDOs at boot.
  #   0x1017 heartbeat: PVED uses 10 ms steps, range 0..100 (=0..1000 ms).
  #           50 -> 500 ms. Defaults to OFF, so the master needs this to supervise.
  #   0x6042 device mode: 0x01 = CAN controlled (required to accept setpoints),
  #           0x02 = hand operated.
  sdo:
    - {index: 0x1017, sub_index: 0, value: 50}     # heartbeat 500 ms (10 ms steps)
    - {index: 0x6042, sub_index: 0, value: 1}      # device mode = CAN controlled

  # PDO layout per the manual (COB-IDs are configurable on this device, so the
  # master may remap freely -- unlike the DST X720 inclinometer).
  #   RPDO1 (0x200+id): Vpoc set point (spool command), int16 -16384..+16384
  #   RPDO2 (0x300+id): control word (DSM) + device mode
  #   TPDO1 (0x180+id): status word + Vpoc actual (spool position)
  #   TPDO2 (0x280+id): demand value + PCB temperature (telemetry)
  # This firmware rejects RPDO2/TPDO2 over SDO (config download abort 0x06040047),
  # so everything rides RPDO1/TPDO1 -- the device's native single-PDO layout.
  # Device mode is set once via the boot SDO above (0x6042), not via a PDO.
  rpdo:
    1:
      enabled: true
      cob_id: "auto"
      transmission: 0xFF
      mapping:
        - {index: 0x6040, sub_index: 0}  # control word: 0x08 Init 0x09 Disabled 0x0B Hold 0x0F Active
        - {index: 0x6300, sub_index: 1}  # Vpoc set point (int16, +/-16384 = +/-100% spool)

  tpdo:
    1:
      enabled: true
      cob_id: "auto"
      transmission: 0xFF
      mapping:
        - {index: 0x6041, sub_index: 0}  # status word
        - {index: 0x6301, sub_index: 1}  # Vpoc actual = spool position (int16, +/-16384 = +/-100%)

nodes:
  hydraulic_axis_1:
    node_id: 16                          # PVED-CC, confirmed on the bus (boot-up 0x710)
    vendor_id: 0x01000019                # 0x1018:1
    product_code: 0x53373235             # 0x1018:2
    # revision_number: 0x00010100        # 0x1018:3

    # Spool setpoint/feedback scaling. Device is int16 -16384..+16384 = -100%..+100%.
    # These defaults make the ROS interface work in PERCENT (-100 .. +100):
    scale_target_to_dev: 163.84          # percent -> raw   (16384 / 100)
    scale_actual_from_dev: 0.006103515625  # raw -> percent (100 / 16384)
    offset: 0.0
    # float_setpoint_raw: 32767          # value written to request float state
    # init_timeout_ms: 5000
